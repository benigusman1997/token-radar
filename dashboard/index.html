<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar: pre-token protocols ranked by implied launch value</title>
<link rel="stylesheet" href="03-app.css">
</head>
<body>
<header>
  <b>◎ Token Radar</b><span id="sub"></span>
  <div id="checks"></div>
</header>
<main>
  <div id="board">
    <div id="summary"></div>
    <nav id="tabs"><a href="#radar">No token yet</a><a href="#tokens">Token trades</a><a href="#ledger">All protocols</a></nav>
    <div id="filters">
      <span class="seg" id="segV"></span><span class="seg" id="segT"></span>
      <input id="q" type="search" placeholder="Search name, chain, category">
      <select id="cat"><option value="">All categories</option></select>
      <select id="chain"><option value="">All chains</option></select>
      <label>Ticket</label><span class="seg" id="segK"></span>
      <label>Drop share</label><span class="seg" id="segS"></span>
      <label>T-bill</label><span class="seg" id="segB"></span>
      <button id="reset">Reset</button><button id="csv">CSV</button>
    </div>
    <p id="count"></p>
    <div id="view"></div>
  </div>
  <article id="detail" hidden></article>
</main>
<footer>Estimates from one sealed DefiLlama snapshot. "No token" means DefiLlama records none; it is not a promise one is coming. Not financial advice.</footer>
<script src="z-data.js"></script>
<script src="01-model.js"></script>
<script src="02-app.js"></script>
</body>
</html>
